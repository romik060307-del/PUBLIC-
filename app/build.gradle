plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rk.publicbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rk.publicbridge'
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
